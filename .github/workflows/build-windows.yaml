name: Build Library
run-name: Building new version of the flyout multifunction display app.

on: [push]

permissions:
  contents: write

jobs:
  Builder:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Clone the repository
        uses: actions/checkout@v4

      - name: Verify that build path exists
        run: mkdir -p ./out

      - name: Run Build Command.
        run: bash ./build.sh

      - name: Get Meta
        run: |
          echo "REPO_VERSION=$(cat ./versioninfo.json | grep -i '"ProductVersion": "' | sed 's/    "ProductVersion": "/v/' | sed 's/"//')" >> $GITHUB_ENV
          echo "Version: ${{ env.REPO_VERSION }}"

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: false
          draft: false
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: ${{ env.REPO_VERSION }}
          files: |
            ./out/MFD.exe
            ./out/MFD (Debug).exe
            ./icon.png
            ./assets/map.zip